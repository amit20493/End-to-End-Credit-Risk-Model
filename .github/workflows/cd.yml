name: UAT

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  API_KEY: uat-ci-smoke-key

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests
        run: pytest --cov=credit_risk --cov-report=term-missing

  uat:
    needs: quality
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Train UAT artifact
        run: |
          pip install -e ".[dev]"
          python -m credit_risk.cli train --synthetic --quick

      - name: Build UAT image
        run: docker build -t credit-risk-api:uat .

      - name: Start UAT container
        run: |
          docker run -d --name credit-risk-uat -p 8000:8000 \
            -e APP_ENV=uat \
            -e API_KEY="$API_KEY" \
            -e MODEL_PATH=/app/artifacts/model.joblib \
            credit-risk-api:uat
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs credit-risk-uat
          exit 1

      - name: UAT HTTP smoke tests
        run: |
          python scripts/uat_smoke.py
        env:
          UAT_BASE_URL: http://127.0.0.1:8000
          API_KEY: ${{ env.API_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push UAT image
        run: |
          IMAGE=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="uat-${GITHUB_SHA::7}"
          docker tag credit-risk-api:uat "${IMAGE}:uat"
          docker tag credit-risk-api:uat "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:uat"
          docker push "${IMAGE}:${SHA_TAG}"
          echo "Pushed ${IMAGE}:uat and ${IMAGE}:${SHA_TAG}"
